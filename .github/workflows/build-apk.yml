# Builds an Android APK from index.html using Capacitor.
# In GitHub this file must live at: .github/workflows/build-apk.yml
name: Build APK

# Runs only when you press "Run workflow" in the Actions tab
on: workflow_dispatch

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      # 1. Fetch your repository (index.html)
      - uses: actions/checkout@v4

      # 2. Install Node and Java (the Android SDK is already on the runner)
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      # 3. Put the app in a "www" folder, which is what Capacitor packages
      - name: Prepare web files
        run: |
          mkdir -p www
          cp index.html www/index.html

      # 4. Create the Android project around it
      - name: Create Capacitor project
        run: |
          npm init -y
          npm install @capacitor/core @capacitor/cli @capacitor/android @capacitor/filesystem @capacitor/share
          npx cap init "Budget Log" com.budgetlog.app --web-dir www
          npx cap add android
          npx cap sync android

      # 5. Build the installable APK
      - name: Build APK
        working-directory: android
        run: ./gradlew assembleDebug

      # 6. Make the APK downloadable from the run page
      - uses: actions/upload-artifact@v4
        with:
          name: budget-log-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
