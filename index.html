<!DOCTYPE html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#f2f2f7">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Budget Log">
<title>Project Budget Log</title>
<style>
/* ---------- Design tokens: one place to change the look ---------- */
:root{--bg:#f2f2f7;--card:#fff;--tx:#1c1c1e;--mu:#8e8e93;--ln:#e5e5ea;--ac:#0a84ff;
--ok:#34c759;--am:#ff9f0a;--rd:#ff3b30;--r:18px;--ease:cubic-bezier(.32,.72,0,1)}
[data-d]{--bg:#000;--card:#1c1c1e;--tx:#f2f2f7;--mu:#98989f;--ln:#2c2c2e}
/* Themes: only the accent colour changes */
[data-t=forest]{--ac:#2f9e6b}[data-t=sunset]{--ac:#f0643c}[data-t=violet]{--ac:#7c5cfa}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--tx);overflow-x:hidden}
body{font:16px/1.4 -apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",Roboto,sans-serif}
button,input,select{font:inherit;color:inherit}
main{max-width:560px;margin:0 auto;padding:calc(20px + env(safe-area-inset-top)) 16px calc(100px + env(safe-area-inset-bottom))}
h1{font-size:32px;margin:8px 0 0;letter-spacing:-.6px}
h2{font-size:15px;margin:0;color:var(--mu);font-weight:600}
h3{margin:4px 0 14px;font-size:20px;text-align:center}
.sub{color:var(--mu);margin:2px 0 18px}
.fresh{animation:up .35s var(--ease)}
@keyframes up{from{opacity:0;transform:translateY(10px)}}
@keyframes grow{from{transform:scaleX(0)}}
/* Buttons press down slightly, like iOS */
button{border:0;background:none;cursor:pointer;transition:transform .15s var(--ease),opacity .15s}
button:active,.row[data-a]:active{transform:scale(.97);opacity:.8}
.big{width:100%;min-height:56px;border-radius:16px;background:var(--ac);color:#fff;font-weight:600;font-size:17px;margin:14px 0}
.link{color:var(--ac);min-height:48px;padding:0 8px;font-weight:500}
.dng{color:var(--rd)}
/* Grouped list: one card, hairline dividers, no clutter */
.grp{background:var(--card);border-radius:var(--r);overflow:hidden;margin:8px 0 18px}
.row{display:flex;align-items:center;justify-content:space-between;gap:12px;min-height:56px;padding:8px 16px;border-top:1px solid var(--ln);width:100%;text-align:left}
.row:first-child{border-top:0}
.row small{display:block;color:var(--mu);font-size:13px}
.row input:not([type=checkbox]){border:0;background:none;text-align:right;outline:0;min-width:0;flex:1;min-height:48px}
.hd{display:flex;justify-content:space-between;align-items:baseline;margin-top:20px}
.hero{background:var(--ac);color:#fff;border-radius:24px;padding:22px 20px}
.hero span{opacity:.85;font-size:14px}.hero b{display:block;font-size:36px;letter-spacing:-1px;margin:4px 0 8px}
.hero small{display:block;opacity:.9}
.neg{color:#ffd2cf}
.ban{background:var(--card);border-radius:14px;padding:12px 16px;margin-top:12px;border-left:4px solid var(--am)}
/* Progress bars */
.bar{height:8px;border-radius:4px;background:var(--ln);overflow:hidden;margin:8px 0 4px}
.bar i{display:block;height:100%;background:var(--ok);border-radius:4px;transform-origin:left}
.fresh .bar i{animation:grow .6s var(--ease)}
.bar.am i{background:var(--am)}.bar.rd i{background:var(--rd)}
.am-t{color:var(--am)}.rd-t{color:var(--rd)}
.line{display:block;width:100%;padding:14px 16px;border-top:1px solid var(--ln);text-align:left}
.line:first-child{border-top:0}
.line .t{display:flex;justify-content:space-between;font-weight:600}
.line small{color:var(--mu);font-size:13px}
.empty{text-align:center;color:var(--mu);padding:28px 12px}
/* Chips and segmented controls */
.chips{display:flex;flex-wrap:wrap;gap:8px;margin:10px 0}
.chip{min-height:48px;padding:0 16px;border-radius:24px;background:var(--card);font-weight:500}
.chip.on,.seg .on{background:var(--ac);color:#fff}
.seg{display:flex;background:var(--ln);border-radius:12px;padding:3px;margin:10px 0}
.seg button{flex:1;min-height:44px;border-radius:10px}
.sw{display:flex;gap:14px;padding:12px 16px}
.sw button{width:48px;height:48px;border-radius:50%;border:3px solid transparent;background-clip:padding-box}
.sw .on{box-shadow:0 0 0 2px var(--tx)}
/* Bottom tab bar with iOS-style blur */
nav{position:fixed;left:0;right:0;bottom:0;display:flex;justify-content:center;padding-bottom:env(safe-area-inset-bottom);
background:color-mix(in srgb,var(--card) 80%,transparent);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);border-top:1px solid var(--ln)}
nav button{flex:1;max-width:140px;min-height:56px;color:var(--mu);font-size:11px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px}
nav button.on{color:var(--ac)}
nav svg{width:24px;height:24px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
/* Bottom sheet */
.ov{position:fixed;inset:0;background:rgba(0,0,0,0);display:flex;align-items:flex-end;justify-content:center;z-index:5;transition:background .3s}
.ov.on{background:rgba(0,0,0,.35)}
.sh{background:var(--bg);width:100%;max-width:560px;max-height:92vh;overflow-y:auto;border-radius:24px 24px 0 0;padding:10px 16px calc(20px + env(safe-area-inset-bottom));transform:translateY(100%);transition:transform .35s var(--ease)}
.on .sh{transform:none}
.gr{width:40px;height:5px;border-radius:3px;background:var(--ln);margin:0 auto 10px}
.amt{width:100%;font-size:44px;font-weight:700;text-align:center;border:0;background:none;outline:0;min-height:64px;letter-spacing:-1px}
.amt.bad{color:var(--rd)}
.pv{background:var(--card);border-radius:14px;padding:4px 16px;margin:6px 0 14px;font-size:15px}
.pv div{display:flex;justify-content:space-between;padding:6px 0}
.hint{color:var(--mu);font-size:13px;margin:0 4px 10px}
#toast{position:fixed;left:50%;bottom:calc(76px + env(safe-area-inset-bottom));transform:translate(-50%,20px);opacity:0;z-index:9;background:#2c2c2e;color:#fff;border-radius:24px;padding:12px 18px;display:flex;gap:14px;align-items:center;max-width:92%;transition:.3s var(--ease);pointer-events:none}
#toast.on{opacity:1;transform:translate(-50%,0);pointer-events:auto}
#toast button{color:#64b5ff;font-weight:600;min-height:32px}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<main id="v"></main>
<nav>
<button data-t="today"><svg viewBox="0 0 24 24"><path d="M5 5h14v15H5zM5 10h14M9 3v4M15 3v4"/></svg>Today</button>
<button data-t="budget"><svg viewBox="0 0 24 24"><path d="M12 3a9 9 0 1 0 9 9h-9z"/></svg>Budget</button>
<button data-t="history"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg>History</button>
<button data-t="projects"><svg viewBox="0 0 24 24"><path d="M12 3l9 5-9 5-9-5zM3 13l9 5 9-5"/></svg>Projects</button>
</nav>
<div id="toast"></div>
<script>
'use strict';
/* =========================================================
   1. DATA: one object, saved to localStorage as JSON
   ========================================================= */
const KEY='pbl.v1';
// projects[] each hold their own lines, funds, exp (expenses) and chips (quick-adds)
let db={projects:[],cur:null,last:{},theme:'ocean',mode:'auto'};
try{const r=localStorage.getItem(KEY);if(r)Object.assign(db,JSON.parse(r))}catch(e){/* empty or blocked storage: start fresh */}
function save(){try{localStorage.setItem(KEY,JSON.stringify(db))}catch(e){toast('Could not save: storage is full or blocked')}}

/* ---------- small helpers ---------- */
const $=s=>document.querySelector(s);
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const uid=()=>Math.random().toString(36).slice(2,9);
const iso=d=>new Date(d.getTime()-d.getTimezoneOffset()*6e4).toISOString().slice(0,10); // local date as YYYY-MM-DD
const today=()=>iso(new Date());
const fmt=n=>Number(n).toLocaleString('en-GB',{maximumFractionDigits:2}); // thousands separators
const M=(p,n)=>p.cur+' '+fmt(n);
const P=()=>db.projects.find(p=>p.id===db.cur&&!p.archived)||db.projects.find(p=>!p.archived);

/* =========================================================
   2. CORE LOGIC: remaining = allocated + funds - spent
   Nothing resets daily, so unspent money simply accumulates.
   ========================================================= */
function lineStat(p,l){
  const funds=p.funds.filter(f=>f.line===l.id).reduce((a,f)=>a+f.amt,0);
  const spent=p.exp.filter(e=>e.line===l.id).reduce((a,e)=>a+e.amt,0);
  const budget=l.alloc+funds;
  return{funds,spent,budget,rem:budget-spent,pct:budget>0?spent/budget*100:(spent>0?100:0)};
}
function tot(p){
  return p.lines.reduce((t,l)=>{const s=lineStat(p,l);t.budget+=s.budget;t.spent+=s.spent;t.rem+=s.rem;return t},{budget:0,spent:0,rem:0});
}
// Days left, counting today (and starting from the start date if the project hasn't begun)
function days(p){
  const d=s=>new Date(s+'T00:00'),t=d(today()),s=d(p.start),from=t>s?t:s;
  return Math.max(0,Math.round((d(p.end)-from)/864e5)+1);
}
const safe=(p,rem)=>rem>0?rem/Math.max(1,days(p)):0; // "Safe to spend per day"
const lv=pct=>pct>=100?'rd':pct>=80?'am':''; // warning level: amber at 80%, red at 100%
const bar=pct=>`<div class="bar ${lv(pct)}"><i style="width:${Math.min(100,pct)}%"></i></div>`;

/* =========================================================
   3. UI HELPERS: toast, bottom sheet, theme
   ========================================================= */
let tt;
function toast(msg,undo){
  const t=$('#toast');t.innerHTML=esc(msg)+(undo?'<button>Undo</button>':'');
  if(undo)t.querySelector('button').onclick=()=>{undo();t.classList.remove('on')};
  t.classList.add('on');clearTimeout(tt);tt=setTimeout(()=>t.classList.remove('on'),undo?5000:2500);
}
function sheet(html,mount){
  closeSheet();
  const o=document.createElement('div');o.className='ov';o.innerHTML='<div class="sh"><div class="gr"></div>'+html+'</div>';
  document.body.appendChild(o);
  requestAnimationFrame(()=>o.classList.add('on'));
  o.onclick=e=>{if(e.target===o)closeSheet()};
  mount(o);
}
function closeSheet(){const o=$('.ov.on');if(o){o.classList.remove('on');setTimeout(()=>o.remove(),300)}}
function theme(){
  const dark=db.mode==='dark'||(db.mode==='auto'&&matchMedia('(prefers-color-scheme:dark)').matches);
  const h=document.documentElement;h.toggleAttribute('data-d',dark);h.dataset.t=db.theme;
  $('meta[name=theme-color]').content=dark?'#000':'#f2f2f7';
}
matchMedia('(prefers-color-scheme:dark)').addEventListener('change',theme);

/* =========================================================
   4. SCREENS: each returns an HTML string
   ========================================================= */
let tab='today',fresh=true,H={q:'',l:'',from:'',to:''};
function render(){
  const p=P(),v=$('#v');theme();
  v.className=fresh?'fresh':'';fresh=false;
  v.innerHTML=(!p||tab==='projects')?vProjects(p):{today:vToday,budget:vBudget,history:vHistory}[tab](p);
  document.querySelectorAll('nav button').forEach(b=>b.classList.toggle('on',b.dataset.t===tab));
  if(tab==='history'&&p)histList();
}
const entryRow=(p,e)=>{
  const l=p.lines.find(x=>x.id===e.line);
  return`<button class="row" data-a="edit" data-id="${e.id}"><span>${esc(e.note||(l?l.name:'Expense'))}<small>${l?esc(l.name):'Deleted line'}${e.type==='Top-up'?', top-up':''}</small></span><b>${M(p,e.amt)}</b></button>`;
};
function vToday(p){
  const t=tot(p),d=days(p),te=p.exp.filter(e=>e.date===today()),sum=te.reduce((a,e)=>a+e.amt,0);
  const inRange=today()>=p.start&&today()<=p.end;
  return`<h1>Today</h1><p class="sub">${esc(p.name)}</p>
  <div class="hero"><span>Remaining till end of project</span><b class="${t.rem<0?'neg':''}">${M(p,t.rem)}</b>
  <small>${d} day${d===1?'':'s'} left</small><small>${M(p,safe(p,t.rem))} safe to spend per day</small></div>
  ${!te.length&&inRange?'<div class="ban">Nothing logged yet today.</div>':''}
  <button class="big" data-a="add">Add expense</button>
  ${p.chips&&p.chips.length?'<div class="chips">'+p.chips.map((c,i)=>`<button class="chip" data-a="chip" data-id="${i}">${esc(c.note||'Quick add')} ${fmt(c.amt)}</button>`).join('')+'</div>':''}
  <div class="hd"><h2>Today's entries</h2><h2>${M(p,sum)}</h2></div>
  ${te.length?'<div class="grp">'+te.map(e=>entryRow(p,e)).join('')+'</div>':'<div class="empty">No expenses yet today.</div>'}`;
}
function vBudget(p){
  const t=tot(p);
  return`<h1>Budget</h1><p class="sub">${esc(p.name)}</p>
  <div class="grp"><div class="row"><span>Total budget</span><b>${M(p,t.budget)}</b></div>
  <div class="row"><span>Spent</span><b>${M(p,t.spent)}</b></div>
  <div class="row"><span>Remaining till end of project</span><b>${M(p,t.rem)}</b></div></div>
  ${p.lines.length?'<div class="grp">'+p.lines.map(l=>{
    const s=lineStat(p,l);
    return`<button class="line" data-a="line" data-id="${l.id}"><div class="t"><span>${esc(l.name)}</span><span class="${lv(s.pct)}-t">${M(p,s.rem)}</span></div>${bar(s.pct)}
    <small>${fmt(s.spent)} spent of ${fmt(s.budget)}</small>${s.rem<0?`<small class="rd-t"> Over budget by ${M(p,-s.rem)}</small>`:s.rem>0?`<small> ${M(p,safe(p,s.rem))} per day</small>`:''}</button>`}).join('')+'</div>'
  :'<div class="empty">Add your first budget line, for example Refreshments.</div>'}
  <button class="big" data-a="newline">Add budget line</button>`;
}
function vHistory(p){
  return`<h1>History</h1><p class="sub">Tap an entry to edit or delete it.</p>
  <div class="grp"><label class="row">Search<input id="hq" placeholder="Note or line" value="${esc(H.q)}"></label></div>
  <details ${H.l||H.from||H.to?'open':''}><summary class="link" style="list-style:none;display:flex;align-items:center">Filters</summary>
  <div class="grp"><label class="row">Line<select id="hl2"><option value="">All</option>${p.lines.map(l=>`<option value="${l.id}" ${H.l===l.id?'selected':''}>${esc(l.name)}</option>`).join('')}</select></label>
  <label class="row">From<input id="hf" type="date" value="${H.from}"></label><label class="row">To<input id="ht" type="date" value="${H.to}"></label></div></details>
  <div id="hlist"></div>`;
}
function histList(){
  const p=P(),q=H.q.toLowerCase();
  const rows=p.exp.filter(e=>{
    const l=p.lines.find(x=>x.id===e.line);
    return(!H.l||e.line===H.l)&&(!H.from||e.date>=H.from)&&(!H.to||e.date<=H.to)&&(!q||(e.note+' '+(l?l.name:'')).toLowerCase().includes(q));
  }).sort((a,b)=>b.date.localeCompare(a.date));
  const by={};rows.forEach(e=>(by[e.date]=by[e.date]||[]).push(e));
  const label=d=>d===today()?'Today':new Date(d+'T00:00').toLocaleDateString('en-GB',{weekday:'short',day:'numeric',month:'short',year:'numeric'});
  $('#hlist').innerHTML=Object.keys(by).map(d=>`<div class="hd"><h2>${label(d)}</h2><h2>${M(p,by[d].reduce((a,e)=>a+e.amt,0))}</h2></div><div class="grp">${by[d].map(e=>entryRow(p,e)).join('')}</div>`).join('')||'<div class="empty">No matching entries.</div>';
}
function vProjects(p){
  const act=db.projects.filter(x=>!x.archived),arc=db.projects.filter(x=>x.archived);
  const pr=x=>`<div class="row" data-a="sw" data-id="${x.id}"><span>${esc(x.name)}${p&&x.id===p.id?' (open)':''}<small>${x.start} to ${x.end}</small></span><button class="link" data-a="arch" data-id="${x.id}">${x.archived?'Restore':'Archive'}</button></div>`;
  return`<h1>Projects</h1><p class="sub">${p?'Tap a project to open it.':'Create a project to begin.'}</p>
  ${act.length?'<div class="grp">'+act.map(pr).join('')+'</div>':''}
  <button class="big" data-a="newproj">New project</button>
  ${arc.length?'<h2>Archived</h2><div class="grp">'+arc.map(pr).join('')+'</div>':''}
  <h2>Theme</h2><div class="grp"><div class="sw">${[['ocean','#0a84ff'],['forest','#2f9e6b'],['sunset','#f0643c'],['violet','#7c5cfa']].map(([n,c])=>`<button class="${db.theme===n?'on':''}" style="background:${c}" data-a="theme" data-id="${n}" aria-label="${n}"></button>`).join('')}</div>
  <div class="seg" style="margin:0 16px 12px">${['auto','light','dark'].map(m=>`<button class="${db.mode===m?'on':''}" data-a="mode" data-id="${m}">${m[0].toUpperCase()+m.slice(1)}</button>`).join('')}</div></div>
  <h2>Your data</h2><div class="grp">
  <button class="row" data-a="csv">Export history as CSV</button><button class="row" data-a="json">Back up everything (JSON)</button>
  <label class="row">Restore from backup<input id="imp" type="file" accept=".json,application/json" style="display:none"><span class="link">Choose file</span></label></div>`;
}

/* =========================================================
   5. SHEETS: add/edit expense, project, line, funds
   ========================================================= */
function expSheet(e,pre,chipIdx){
  const p=P();pre=pre||{};
  if(!p.lines.length){toast('Add a budget line first');tab='budget';render();return}
  // The budget line selector remembers the last one used
  let sel=(e&&e.line)||pre.line||(p.lines.some(l=>l.id===db.last[p.id])?db.last[p.id]:p.lines[0].id),type=e?e.type:'New purchase';
  sheet(`<h3>${e?'Edit expense':'Add expense'}</h3>
  <input id="a" class="amt" type="number" inputmode="decimal" step="any" min="0" placeholder="0">
  <div class="chips" id="lc" style="justify-content:center">${p.lines.map(l=>`<button class="chip" data-l="${l.id}">${esc(l.name)}</button>`).join('')}</div>
  <div class="pv" id="pv"></div>
  <div class="grp"><label class="row">Date<input id="d" type="date"></label><label class="row">Note<input id="n" maxlength="60" placeholder="Optional"></label></div>
  <div class="seg" id="ty"><button data-v="New purchase">New purchase</button><button data-v="Top-up">Top-up</button></div>
  <p class="hint">Top-up means you only replaced what was used.</p>
  ${e?'':'<label class="row"><span>Save as quick add</span><input type="checkbox" id="qa" style="width:24px;height:24px"></label>'}
  <button class="big" id="sv">Save</button>
  ${e?'<button class="link dng" id="del" style="width:100%">Delete expense</button>':''}
  ${chipIdx!=null?'<button class="link dng" id="rmq" style="width:100%">Remove this quick add</button>':''}`,o=>{
    const a=o.querySelector('#a'),d=o.querySelector('#d'),n=o.querySelector('#n'),pv=o.querySelector('#pv');
    a.value=e?e.amt:(pre.amt||'');d.value=e?e.date:today();n.value=e?e.note:(pre.note||'');
    // Preview: budget, total after this entry, and what remains
    const upd=()=>{
      o.querySelectorAll('#lc .chip').forEach(c=>c.classList.toggle('on',c.dataset.l===sel));
      o.querySelectorAll('#ty button').forEach(b=>b.classList.toggle('on',b.dataset.v===type));
      const l=p.lines.find(x=>x.id===sel),s=lineStat(p,l),amt=parseFloat(a.value)||0;
      const after=s.spent-(e&&e.line===sel?e.amt:0)+amt,rem=s.budget-after,pct=s.budget>0?after/s.budget*100:(after>0?100:0);
      pv.innerHTML=`<div><span>Expected budget</span><b>${M(p,s.budget)}</b></div><div><span>Spent after this entry</span><b>${M(p,after)}</b></div>
      <div><span>Remaining after this entry</span><b class="${lv(pct)}-t">${M(p,rem)}</b></div>
      ${pct>=100?`<div class="rd-t"><b>${rem<0?'Over budget by '+M(p,-rem):'Budget fully used'}</b></div>`:pct>=80?`<div class="am-t"><b>${Math.round(pct)}% of this line used</b></div>`:''}`;
    };
    o.querySelector('#lc').onclick=ev=>{const b=ev.target.closest('.chip');if(b){sel=b.dataset.l;upd()}};
    o.querySelector('#ty').onclick=ev=>{const b=ev.target.closest('button');if(b){type=b.dataset.v;upd()}};
    a.oninput=upd;upd();a.focus({preventScroll:true}); // opens the numeric keypad straight away
    o.querySelector('#sv').onclick=()=>{
      const amt=parseFloat(a.value);
      if(!(amt>0)){a.classList.add('bad');a.focus();toast('Enter an amount above zero');return} // rejects empty, zero, negative
      const rec={date:d.value||today(),line:sel,amt,note:n.value.trim(),type};
      if(e)Object.assign(e,rec);else p.exp.push(Object.assign({id:uid()},rec));
      db.last[p.id]=sel;
      const qa=o.querySelector('#qa');if(qa&&qa.checked){(p.chips=p.chips||[]).push({note:rec.note,amt,line:sel})}
      save();closeSheet();render();
      const s=lineStat(p,p.lines.find(l=>l.id===sel)); // warn, but never block
      toast(s.rem<0?'Saved. Over budget by '+M(p,-s.rem):s.pct>=100?'Saved. Line fully used':s.pct>=80?'Saved. '+Math.round(s.pct)+'% of line used':'Saved');
    };
    const del=o.querySelector('#del');
    if(del)del.onclick=()=>{
      const i=p.exp.indexOf(e);p.exp.splice(i,1);save();closeSheet();render();
      toast('Expense deleted',()=>{p.exp.splice(i,0,e);save();render()}); // undo puts it back in place
    };
    const rm=o.querySelector('#rmq');if(rm)rm.onclick=()=>{p.chips.splice(chipIdx,1);save();closeSheet();render()};
  });
}
function projSheet(){
  sheet(`<h3>New project</h3><div class="grp">
  <label class="row">Name<input id="pn" placeholder="e.g. Office event"></label>
  <label class="row">Start<input id="ps" type="date"></label><label class="row">End<input id="pe" type="date"></label>
  <label class="row">Currency<input id="pc" maxlength="4"></label></div><button class="big" id="sv">Create project</button>`,o=>{
    const g=i=>o.querySelector(i);
    g('#ps').value=today();g('#pe').value=iso(new Date(Date.now()+30*864e5));g('#pc').value='KES'; // sensible defaults
    g('#pn').focus({preventScroll:true});
    g('#sv').onclick=()=>{
      const name=g('#pn').value.trim(),s=g('#ps').value||today(),e=g('#pe').value;
      if(!name)return toast('Give the project a name');
      if(!e||e<s)return toast('End date must be after the start date');
      const p={id:uid(),name,start:s,end:e,cur:(g('#pc').value.trim()||'KES').toUpperCase(),archived:false,lines:[],funds:[],exp:[],chips:[]};
      db.projects.push(p);db.cur=p.id;save();closeSheet();tab='budget';fresh=true;render();toast('Now add a budget line');
    };
  });
}
function lineSheet(l){
  const p=P(),s=l&&lineStat(p,l);
  sheet(`<h3>${l?'Edit budget line':'New budget line'}</h3><div class="grp">
  <label class="row">Name<input id="ln" placeholder="e.g. Refreshments"></label><label class="row">Allocated<input id="la" type="number" inputmode="decimal" min="0" step="any" placeholder="0"></label></div>
  <button class="big" id="sv">Save</button>
  ${l?`<button class="link" id="fd" style="width:100%">Add funds</button>${s.funds?`<p class="hint" style="text-align:center">${M(p,s.funds)} added so far</p>`:''}<button class="link dng" id="dl" style="width:100%">Delete line</button>`:''}`,o=>{
    const g=i=>o.querySelector(i);
    if(l){g('#ln').value=l.name;g('#la').value=l.alloc}else g('#ln').focus({preventScroll:true});
    g('#sv').onclick=()=>{
      const name=g('#ln').value.trim(),al=parseFloat(g('#la').value);
      if(!name)return toast('Give the line a name');
      if(!(al>=0))return toast('Enter an allocated amount of zero or more');
      if(l){l.name=name;l.alloc=al}else p.lines.push({id:uid(),name,alloc:al});
      save();closeSheet();render();
    };
    if(l){
      g('#fd').onclick=()=>fundSheet(l);
      g('#dl').onclick=()=>{ // a line with entries can't be deleted, so no history is lost
        if(p.exp.some(e=>e.line===l.id))return toast('This line has expenses, so it cannot be deleted');
        p.lines=p.lines.filter(x=>x!==l);p.funds=p.funds.filter(f=>f.line!==l.id);save();closeSheet();render();
      };
    }
  });
}
function fundSheet(l){
  const p=P();
  sheet(`<h3>Add funds to ${esc(l.name)}</h3><div class="grp">
  <label class="row">Amount<input id="fa" type="number" inputmode="decimal" min="0" step="any" placeholder="0"></label>
  <label class="row">Reason<input id="fr" placeholder="e.g. Extra guests"></label></div><button class="big" id="sv">Add funds</button>`,o=>{
    o.querySelector('#fa').focus({preventScroll:true});
    o.querySelector('#sv').onclick=()=>{
      const amt=parseFloat(o.querySelector('#fa').value),r=o.querySelector('#fr').value.trim();
      if(!(amt>0))return toast('Enter an amount above zero');
      if(!r)return toast('Add a short reason');
      p.funds.push({id:uid(),line:l.id,amt,reason:r,date:today()});save();closeSheet();render();toast('Funds added');
    };
  });
}

/* =========================================================
   6. ACTIONS: every button uses data-a="name" data-id="..."
   ========================================================= */
async function dl(name,text,type){
  // Inside the Android app, links with "download" don't work, so save a file and open the share sheet instead
  const C=window.Capacitor&&Capacitor.Plugins;
  if(C&&C.Filesystem&&C.Share){
    try{const r=await C.Filesystem.writeFile({path:name,data:text,directory:'CACHE',encoding:'utf8'});await C.Share.share({title:name,url:r.uri})}
    catch(e){toast('Could not export the file')}
    return;
  }
  const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([text],{type}));a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1e3)}
const A={
  add:()=>expSheet(),
  chip:i=>{const c=P().chips[i];expSheet(null,c,+i)},
  edit:id=>{const p=P();expSheet(p.exp.find(e=>e.id===id))},
  line:id=>lineSheet(P().lines.find(l=>l.id===id)),
  newline:()=>lineSheet(),
  newproj:projSheet,
  sw:id=>{db.cur=id;tab='today';fresh=true;save();render()},
  arch:id=>{const x=db.projects.find(p=>p.id===id);x.archived=!x.archived;save();render()},
  theme:n=>{db.theme=n;save();render()},
  mode:m=>{db.mode=m;save();render()},
  csv:()=>{ // one row per expense; quotes doubled so commas in notes are safe
    const p=P();if(!p)return;const q=s=>'"'+String(s).replace(/"/g,'""')+'"';
    const rows=[['Date','Budget line','Type','Amount','Note']].concat(p.exp.slice().sort((a,b)=>a.date.localeCompare(b.date)).map(e=>{const l=p.lines.find(x=>x.id===e.line);return[e.date,l?l.name:'',e.type,e.amt,e.note]}));
    dl(p.name+'.csv',rows.map(r=>r.map(q).join(',')).join('\n'),'text/csv');
  },
  json:()=>dl('budget-log-backup-'+today()+'.json',JSON.stringify(db),'application/json')
};
document.addEventListener('click',ev=>{
  const t=ev.target.closest('[data-t]');if(t&&t.closest('nav')){tab=t.dataset.t;fresh=true;render();return}
  const b=ev.target.closest('[data-a]');if(b&&A[b.dataset.a]){ev.stopPropagation();A[b.dataset.a](b.dataset.id)}
});
// History filters re-draw only the list, so the keyboard stays open while typing
document.addEventListener('input',ev=>{
  const m={hq:'q',hl2:'l',hf:'from',ht:'to'}[ev.target.id];if(m){H[m]=ev.target.value;histList()}
});
document.addEventListener('change',ev=>{
  if(ev.target.id!=='imp'||!ev.target.files[0])return;
  const r=new FileReader();
  r.onload=()=>{try{const d=JSON.parse(r.result);if(!Array.isArray(d.projects))throw 0;
    if(confirm('Replace everything on this device with the backup?')){db=Object.assign(db,d);save();fresh=true;render();toast('Backup restored')}}
    catch(e){toast('That file is not a valid backup')}};
  r.readAsText(ev.target.files[0]);
});

/* =========================================================
   7. INSTALLABLE APP: icon, manifest, service worker
   ========================================================= */
function icon(s){ // draws the app icon in code, so no image file is needed
  const c=document.createElement('canvas');c.width=c.height=s;const x=c.getContext('2d');
  x.fillStyle='#0a84ff';x.fillRect(0,0,s,s);x.strokeStyle='#fff';x.lineWidth=s/12;x.lineCap='round';
  x.beginPath();x.arc(s/2,s/2,s*.26,0,6.283);x.stroke();x.beginPath();x.moveTo(s/2,s*.38);x.lineTo(s/2,s*.62);x.stroke();
  return c.toDataURL('image/png');
}
try{
  const l=document.createElement('link');l.rel='apple-touch-icon';l.href=icon(180);document.head.appendChild(l);
  const m=document.createElement('link');m.rel='manifest';
  m.href=URL.createObjectURL(new Blob([JSON.stringify({name:'Project Budget Log',short_name:'Budget Log',display:'standalone',
    start_url:location.href.split('#')[0],background_color:'#f2f2f7',theme_color:'#0a84ff',
    icons:[{src:icon(192),sizes:'192x192',type:'image/png'},{src:icon(512),sizes:'512x512',type:'image/png'}]})],{type:'application/manifest+json'}));
  document.head.appendChild(m);
}catch(e){}
// Browsers only allow a service worker from a real file, so keep sw.js next to this page.
// If it's missing, the app still works; it just needs a connection to open.
if('serviceWorker' in navigator)navigator.serviceWorker.register('sw.js').catch(()=>{});

render();
</script>
